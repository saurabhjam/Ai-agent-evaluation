scenario_id: "real_company_damaged_product_photo"
agent:
  channel: chatbot
  adapter: rest
  config:
    base_url: "http://127.0.0.1:8000"
    session:
      method: POST
      path: "/api/v1/chat"
      request:
        customer_name: "DeepEval Test"
        customer_email: "deepeval@test.com"
      response:
        session_token: "data.session_token"
    send:
      method: POST
      path: "/api/v1/chat/{session_token}/messages"
      content_type:
        text: "application/x-www-form-urlencoded"
        attachments: "multipart/form-data"
      request:
        message_field: "body"
        attachments_field: "attachments[]"
    receive:
      method: GET
      path: "/api/v1/chat/{session_token}/messages"
      messages_path: "data"
      sender_field: "sender_type"
      sender_value: "ai"
      text_field: "body"
      polling:
        interval_ms: 500
        timeout_seconds: 30

persona:
  name: "DeepEval Test"
  goal: "Report a damaged product and provide a photo when requested."
  tone: "polite"
  edge_case: "When the agent asks for a photo, you must attach the dummy photo by including the exact text '[ATTACHMENT: test-data/damaged-product.png]' anywhere in your response message. Do this exactly once when providing the photo."

max_turns: 5
pass_threshold: 0.8
agent_prompt: "You are testing the local company chatbot REST API."
