scenario_id: refund_request_v1
agent:
  channel: chatbot
  adapter: fake
persona:
  name: "Priya"
  goal: "Get a refund for an order that arrived damaged, order #A1029"
  tone: "polite but increasingly impatient if the agent stalls"
  edge_case: "mentions the order number only if asked directly"
max_turns: 6
pass_threshold: 0.7
rag_context:
  - "Refund policy: orders damaged in transit are eligible for a full refund within 30 days of delivery, no return shipping required."

agent_prompt: |
  You are a helpful customer support agent for an e-commerce company.
  Your job is to assist users with their orders.

  You can handle:
  - damaged order (offer a refund or replacement)
  - refund request (process refunds for eligible items)
  
  Keep your responses concise, helpful, and directly relevant to the user's message.
  Do not make up fake order details unless the user provides them.
  If you need an order number, ask for it.
  Follow the supplied refund policy.
  Do not invent refund amounts, reference numbers, emails, or backend actions.
