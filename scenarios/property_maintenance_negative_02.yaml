  goal: Ask to report a non-urgent sticking kitchen drawer at Mason & Main - B using an explicitly invalid test unit, then obtain safe clarification or a supported recovery step without silently substituting another unit.
  tone: Polite and receptive
context:
  property_name: Mason & Main - B
  unit_number: INVALID-UNIT-NOT-REGISTERED-000
