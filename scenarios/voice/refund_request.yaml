scenario_id: refund_request_voice_v1
channel: voice
agent:
  adapter: fake
persona:
  name: "Priya"
  goal: "Get a refund for an order that arrived damaged, order #A1022"
  tone: "polite but increasingly impatient if the agent stalls"
max_turns: 4
pass_threshold: 0.7
rag_context:
  - "Refund policy: orders damaged in transit are eligible for a full refund within 30 days of delivery, no return shipping required."

conversation:
  turns:
    - speaker: user
      text: "I want a refund for order A1022."
    - speaker: agent
      text: "I can help you with that. Can you tell me why you need a refund?"
    - speaker: user
      text: "The item arrived damaged."
    - speaker: agent
      text: "I'm sorry to hear that. Since it arrived damaged, your refund request has been submitted."
