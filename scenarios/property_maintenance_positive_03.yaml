behavior:
  - Open by naming Mason & Main - B, the sticking bathroom door, and non-urgent priority; omit only the unit number from the available maintenance details.
  - Withhold B1207 until the agent asks for the unit or missing unit information, then supply B1207 directly; it is available, not unknown.
  - After supplying the unit, continue the same request and answer follow-up questions without repeating the whole introduction.
  - Keep the door usable and the priority non-urgent; do not invent a lockout, trapped person, or worsening condition.
  - Do not invent property, unit, maintenance issue, location, urgency, tenant, ticket ID, or submission result; use only configured facts and explicit changes, of which there are none here.
  - Tenant and ticket ID are unavailable; say so if asked and never claim Alex is a verified tenant.
  - Ask for the supported reporting outcome and next steps; do not demand or claim creation if the integration can only explain reporting.
  - Stay in maintenance and finish once a supported outcome or appropriate next step is clear.
success_criteria:
  - Requests the missing unit information rather than inventing it.
  - Retains the property, bathroom door problem, and non-urgent priority while collecting B1207.
  - Continues the original workflow after clarification instead of unnecessarily restarting.
  - Explains supported reporting or evidenced creation and next steps without fabricated tenant, ticket, or submission data.
pass_threshold: 0.70
