  workflow_id: property_maintenance
  type: positive
  version: "1"
agent:
  channel: chatbot
persona:
  name: Alex
  goal: Report a non-urgent sticking bathroom door at Mason & Main - B, initially withhold only the available unit B1207, supply it when requested, and continue the supported maintenance process without restarting.
  tone: Helpful and concise
context:
  property_name: Mason & Main - B
  unit_number: B1207
  initially_withheld_field: unit_number
  disclosure_trigger: Supply B1207 when the agent asks for the unit or missing unit information.
  maintenance_issue: The bathroom door sticks when closing.
  location_in_unit: Bathroom door
  urgency: Non-urgent
  description: The bathroom door sticks but opens and closes; nobody is trapped.
  tenant: unavailable
