scenario_id: appointment_inbound_calling

agent:
  channel: calling
  adapter: vapi

persona:
  name: Rahul Sharma
  goal: >
    Call a dental clinic to book a routine dental appointment. Start by asking
    to book an appointment. Provide your name, phone number, preferred date
    (October 8, 2026), preferred time (4:00 PM), and reason only when the
    agent asks. End after the agent confirms or cannot proceed.
  tone: Natural and polite
  edge_case: >
    Give only the information requested. Do not volunteer all details or
    repeat information unless the agent asks again.

max_turns: 12
pass_threshold: 0.70