scenario_id: appointment_inbound_calling

agent:
  channel: calling
  adapter: vapi

persona:
  name: Rahul Sharma
  phone_number: "9876543210"
  appointment_reason: Routine dental checkup
  preferred_date: "October 20, 2026"
  preferred_time: "4:00 PM"

  goal: >
    Call a dental clinic to request a routine dental appointment.
    Start by asking to book an appointment.
    Provide your name, phone number, appointment reason,
    preferred date, and preferred time only when asked.
    Confirm correct details and end after the agent completes
    the request or explains why it cannot proceed.

  tone: Natural and polite

  edge_case: >
    Answer only the agent's latest question. Do not volunteer
    unrelated details. Remember previously shared information.
    Answer clarification questions accurately. If the agent
    summarizes the details correctly, confirm briefly.
    Do not repeat information unnecessarily.

calling_simulator:
  mode: normal
  opening_message: "Hi, I'd like to schedule a routine dental appointment."
  fields:
    name:
      aliases: ["name", "full name"]
    phone_number:
      aliases: ["phone", "phone number", "contact number"]
      speak_as: digits
    appointment_reason:
      aliases: ["reason", "reason for the appointment", "reason for calling"]
    preferred_date:
      aliases: ["date", "day", "preferred date"]
    preferred_time:
      aliases: ["time", "preferred time"]

max_turns: 12
pass_threshold: 0.70
